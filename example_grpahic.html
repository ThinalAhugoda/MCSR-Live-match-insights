<!DOCTYPE html>
<html>
<head>
    <style>
        /* 1. Make the canvas full screen and fully transparent */
        html, body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: transparent; /* Transparent background */
            overflow: hidden; /* Hide scrollbars */
            font-family: Arial, sans-serif;
        }

        /* 2. Position your graphic exactly where you want it */
        .lower-third-graphic {
            position: absolute;
            bottom: 50px;
            left: 50px;
            background: rgba(0, 0, 0, 0.8); /* Solid graphic background */
            color: white;
            padding: 15px 30px;
            border-radius: 5px;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <!-- This box will appear in the bottom-left corner of OBS -->
    <div class="lower-third-graphic">
        LIVE BROADCAST
    </div>

</body>
</html>
